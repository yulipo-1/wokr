<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 350px; 
      padding: 20px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }
    .header { text-align: center; margin-bottom: 20px; }
    h1 { color: #1a73e8; font-size: 20px; margin-bottom: 5px; }
    .subtitle { color: #5f6368; font-size: 13px; }
    
    .section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #dadce0;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #202124;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    
    .input-group {
      display: flex;
      gap: 8px;
    }
    
    input[type="password"], input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 2px solid #dadce0;
      border-radius: 8px;
      font-size: 13px;
    }
    
    button {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    button:hover { background: #1557b0; }
    
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    
    .status.show { display: block; }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
    
    .info {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eeeeee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎓 Test Site AI Solver</h1>
    <div class="subtitle">OpenRouter DeepSeek Integration</div>
  </div>

  <div class="section">
    <label>OpenRouter API Key</label>
    <div class="input-group">
      <input type="password" id="apiKey" placeholder="sk-or-v1-...">
      <button id="toggleBtn" style="padding: 10px;">👁</button>
    </div>
    <button id="saveBtn" style="width: 100%; margin-top: 10px;">Save API Key</button>
    
    <div id="status" class="status"></div>
    
    <div style="margin-top: 12px; font-size: 12px;">
      <a href="https://openrouter.ai/keys" target="_blank" style="color: #1a73e8;">Get API key →</a>
    </div>
  </div>

  <div class="section">
    <div class="info">
      <strong>How to use:</strong><br>
      1. Enter your OpenRouter API key above<br>
      2. Navigate to a test site with questions<br>
      3. Click the "Solve with AI" button on the page<br>
      4. The extension will automatically select and submit the correct answer
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
