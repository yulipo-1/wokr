<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      width: 350px; 
      padding: 20px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    .header { 
      text-align: center; 
      margin-bottom: 20px; 
    }
    
    h1 { 
      color: #4a9eff; 
      font-size: 22px; 
      margin-bottom: 5px; 
    }
    
    .subtitle { 
      color: #999; 
      font-size: 13px; 
    }
    
    .section {
      background: #2a2a2a;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #3a3a3a;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #b0b0b0;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 2px solid #3a3a3a;
      border-radius: 8px;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    
    button {
      width: 100%;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    
    button:hover { 
      background: #3a7fd5; 
    }
    
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    
    .status.show { display: block; }
    .status.success { background: #1b4d3e; color: #4ade80; }
    .status.error { background: #4d1b1b; color: #f87171; }
    
    .info {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
      margin-top: 12px;
    }
    
    a {
      color: #4a9eff;
      text-decoration: none;
    }
    
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 Blackboard AI Solver</h1>
    <div class="subtitle">Automated Test Assistant</div>
  </div>

  <div class="section">
    <label>OpenRouter API Key</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-...">
    <button id="saveBtn">Save API Key</button>
    
    <div id="status" class="status"></div>
    
    <div class="info">
      <a href="https://openrouter.ai/keys" target="_blank">Get free API key →</a>
    </div>
  </div>

  <div class="section">
    <button id="startBtn" disabled>Start Automation</button>
    
    <div class="info" style="margin-top: 16px;">
      <strong>How to use:</strong><br>
      1. Save your OpenRouter API key above<br>
      2. Navigate to a Blackboard Ultra test page<br>
      3. Click "Start Automation" to begin<br>
      4. The extension will automatically answer questions and click "Next"
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
